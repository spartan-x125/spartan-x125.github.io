<!doctype html>
<html lang="zh-CN"><head><base href="/clab/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fb"><title>Clab · 信号实验室</title><link rel="stylesheet" href="./studio.css"><link rel="stylesheet" href="./vendor/katex/katex.min.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect rx='12' width='40' height='40' fill='%23182b45'/%3E%3Cpath d='M7 22Q13 6 20 22T33 22' fill='none' stroke='%23ffa15b' stroke-width='3'/%3E%3C/svg%3E"></head>
<body><header class="app-header"><a class="brand" href="./" aria-label="Clab首页"><span class="brand-mark">∿</span>Clab<span class="brand-dot">.</span></a><nav class="main-nav" aria-label="主导航"><a href="#calculator" data-page="calculator">计算器</a><a href="#concepts" data-page="concepts">概念辨析</a></nav><button id="open-signal-library" class="library-trigger">常用信号</button><a class="blog-link" href="../" target="_top">博客 ↗</a></header>
<main id="calculator-page" class="calculator-page"><div class="page-heading"><div><span class="section-label">计算器</span><h1>信号怎样变成输出</h1></div><div class="segmented" aria-label="计算方式"><button data-mode="blocks" class="active">框图</button><button data-mode="expression">表达式</button></div></div>
<section class="builder-card workshop" id="block-editor" aria-label="框图编辑器"><div class="builder-toolbar"><label><select id="graph-preset" aria-label="框图示例"><option value="dsb">DSB相干解调</option><option value="am">AM相干解调</option><option value="envelope">AM包络检波</option><option value="matched">匹配滤波测试</option><option value="blank">空白框图</option></select></label><div class="builder-buttons"><button id="undo-graph" aria-label="撤销框图修改">↶</button><button id="redo-graph" aria-label="重做框图修改">↷</button><button id="delete-selection">删除</button><button id="arrange-graph">整理</button><button id="reset-graph">重置</button><button id="collapse-graph" aria-expanded="true">收起框图</button></div></div><div class="workshop-layout"><aside class="component-palette" aria-label="元件库"><h2>元件</h2><select id="component-category" aria-label="元件分类"></select><div id="component-list"></div></aside><div class="canvas-column"><div id="graph-viewport" class="graph-viewport" tabindex="0" role="application" aria-label="通信框图画布"><div id="block-board" class="graph-world"><svg id="block-wires"></svg><div id="block-nodes"></div><div id="placement-ghost" hidden></div></div></div><div class="canvas-toolbar"><span id="wire-status">从输出端拖线到输入端；空白处拖动平移。</span><div><button id="zoom-out" aria-label="缩小框图">−</button><span id="graph-zoom">100%</span><button id="zoom-in" aria-label="放大框图">＋</button><button id="fit-graph">全图</button></div></div></div><aside class="node-inspector" aria-label="元件属性"><div id="block-properties"></div><div id="node-preview"></div></aside></div><details class="graph-shortcuts"><summary>操作</summary><p>元件库点选后，在画布点击放置。拖动元件时吸附网格；空白处拖动平移，滚轮缩放。输出端可拖线或点选后接到输入端，同一输出可连接多处。右键元件或连线打开菜单；元件右上角的⋯也可打开。点“整理”可恢复规整布局；“全图”随窗口自适应。Esc取消，Delete删除，Ctrl+Z撤销，Ctrl+Shift+Z重做。</p></details></section>
<section id="expression-editor" class="expression-card" hidden><div class="expression-layout"><div><div class="editor-heading"><label for="source-editor">定义</label><select id="expression-preset" aria-label="表达式示例"><option value="tone">余弦信号</option><option value="filter">双音与滤波</option><option value="pulse">矩形脉冲</option><option value="complex">复指数</option></select></div><textarea id="source-editor" spellcheck="false" aria-label="表达式定义" rows="5"></textarea><div class="math-keys" aria-label="数学键盘"></div></div><div class="expression-guide"><div class="editor-heading"><span>信号角色</span><button id="apply-source" class="primary-button">计算 →</button></div><div id="expression-roles"></div><a href="./workbench.html">打开完整对象编辑器 ↗</a></div></div></section>
<p id="calculator-error" class="error-message" role="alert" hidden></p><section class="signal-section" aria-label="信号链"><div class="section-toolbar"><h2>观察对象</h2><label class="compare-option"><input type="checkbox" id="shared-scales" checked>统一刻度</label><label><input type="checkbox" id="overlay-signals">叠加比较</label><label>窗长 T <input id="calc-duration" type="number" min=".25" max="4" step=".25" value="1" aria-label="观察窗长"> s</label><label>范围 ±<input id="calc-fmax" type="number" min="2" max="128" value="24" aria-label="频率范围"> Hz</label></div><div id="signal-chain" class="signal-chain"></div></section>
<div class="plot-toolbar"><div class="view-selector" aria-label="图形视图"></div><label class="focus-label">空间视图<select id="spatial-signal" aria-label="三维与复平面观察对象"></select></label></div><div id="calculator-plots" class="calculator-plots" aria-label="计算图形"></div><div id="calculator-metrics" class="calculator-metrics"></div><details class="technical-details"><summary>定义与计算条件</summary><div id="calculator-model"></div></details></main>
<main id="concepts-page" class="concepts-page" hidden><aside class="concept-sidebar"><label class="concept-search"><span class="sr-only">搜索概念</span><input id="concept-search" type="search" placeholder="搜索概念" aria-label="搜索概念"></label><nav id="concept-list" aria-label="概念单元"></nav><a class="archive-link" href="./notes/通信原理_从提问到理解.html" target="_blank" rel="noopener">历史整理 ↗</a></aside><section class="concept-main"><div class="concept-heading"><span id="concept-chapter" class="section-label"></span><h1 id="concept-title"></h1><div class="distinction"><span id="concept-left"></span><span class="versus">／</span><span id="concept-right"></span></div><p id="concept-summary"></p></div><div class="concept-tabs"><button id="concept-visual-tab" class="active">图解</button><button id="concept-note-tab">推导</button><a id="standalone-note" target="_blank" rel="noopener">独立阅读 ↗</a></div><section id="concept-visual"><div id="concept-flow" class="concept-flow"></div><div id="concept-controls" class="lab-controls"></div><div id="concept-stage" class="diagram-stage"></div><div id="concept-metrics" class="lab-metrics"></div><p id="concept-conclusion" class="concept-conclusion"></p><details class="technical-details"><summary>公式与条件</summary><div id="concept-model"></div></details></section><article id="concept-note" class="teaching-note" hidden></article><nav class="unit-pagination"><button id="previous-unit">← 上一单元</button><button id="next-unit">下一单元 →</button></nav></section></main><dialog id="signal-library-dialog" class="signal-library-dialog"><header><h2>常用信号</h2><button id="close-signal-library" aria-label="关闭常用信号">×</button></header><div id="signal-library-tabs" class="library-tabs"></div><div id="signal-library-items"></div></dialog><noscript>请启用JavaScript，或打开<a href="./notes/通信原理_从提问到理解.html">阅读文档</a>。</noscript><script type="module" src="./src/studio.js"></script></body></html>
